    branch: main
    commit: "d3d5630a"
    scope: [main.py, rag_agent/agent.py, rag_agent/tools/__init__.py, rag_agent/tools/add_data.py, rag_agent/tools/get_corpus_info.py,
      rag_agent/tools/rag_query.py]
  issued:
    by: A2AS.org
